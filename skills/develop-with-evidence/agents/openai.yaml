interface:
  display_name: "Develop with Evidence"
  short_description: "Verify and self-review changes by type, with traceable evidence"
  default_prompt: "Use $develop-with-evidence to develop this change: choose the verification strategy by change type, and before the PR, write the handoff file with the evidence tied to the final code, what is still unverified, and an English PR description draft."
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
